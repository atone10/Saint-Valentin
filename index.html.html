<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear's Global Flower Hunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* Mobile portrait aspect ratio */
            height: 800px;
            max-height: 90vh;
            background-color: #e6f5d0; /* Default grass green */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            transition: background 1s ease;
        }

        .location-text {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            color: #555;
            text-shadow: 2px 2px 0px white;
            z-index: 10;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
        }

        .show-text {
            opacity: 1;
            transform: translateY(0);
        }

        /* Special style for the long final message */
        .final-message {
            position: absolute;
            top: 80px;
            width: 90%;
            left: 5%;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 18px;
            color: #e91e63;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 15px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease;
            z-index: 15;
        }
        .show-final-message {
            opacity: 1;
            transform: translateY(0);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 20;
            transition: bottom 0.5s ease; /* Smooth move for button */
        }

        .btn {
            background: white;
            color: #ff8fab;
            border: 4px solid #ffc2d1;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 #ffc2d1;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #ffc2d1;
        }
        
        .btn.auto-playing {
            cursor: default;
            transform: none !important;
            box-shadow: 0 5px 0 #ddd !important;
            border-color: #eee !important;
            color: #888 !important;
        }

        .hidden {
            display: none;
        }

        .thought-bubble {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 20px;
            border-radius: 50%;
            border: 3px solid #ccc;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .thought-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            border-bottom: 3px solid #ccc;
            border-left: 3px solid #ccc;
        }
        .thought-bubble::before {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 10px;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            border: 3px solid #ccc;
        }
        
        @keyframes popUpBouquet {
            0% { transform: scale(0) translateY(100px); opacity: 0; }
            60% { transform: scale(1.1) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="location-display" class="location-text">Start</div>
    <div id="final-msg-display" class="final-message">Here are flowers for you, I traveled the world to collect these and give them to you</div>
    
    <div id="thought" class="thought-bubble">
        <!-- White bear face in thought bubble (recipient) -->
        <div style="position: relative; width: 50px; height: 45px; background: #ffffff; border-radius: 25px 25px 20px 20px; border: 1px solid #ddd;">
            <div style="position: absolute; top: -5px; left: 5px; width: 12px; height: 12px; background: #ffffff; border-radius: 50%; border: 1px solid #ddd;"></div>
            <div style="position: absolute; top: -5px; right: 5px; width: 12px; height: 12px; background: #ffffff; border-radius: 50%; border: 1px solid #ddd;"></div>
            <div style="position: absolute; top: 18px; left: 12px; width: 4px; height: 4px; background: #3e2723; border-radius: 50%;"></div>
            <div style="position: absolute; top: 18px; right: 12px; width: 4px; height: 4px; background: #3e2723; border-radius: 50%;"></div>
            <div style="position: absolute; top: 22px; left: 18px; width: 14px; height: 10px; background: #fff; border-radius: 50%;"></div>
            <div style="position: absolute; top: 24px; left: 23px; width: 4px; height: 3px; background: #3e2723; border-radius: 50%;"></div>
        </div>
    </div>

    <canvas id="worldCanvas"></canvas>

    <div class="controls">
        <button id="action-btn" class="btn pulse">Start Journey</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');
    const locationText = document.getElementById('location-display');
    const finalMsgText = document.getElementById('final-msg-display');
    const actionBtn = document.getElementById('action-btn');
    const thoughtBubble = document.getElementById('thought');

    // Canvas Sizing
    let cw = container.clientWidth;
    let ch = container.clientHeight;
    canvas.width = cw;
    canvas.height = ch;

    // Game State
    let gameState = 'start'; 
    let frame = 0;
    let waitTimer = 0; 
    let endSequenceTimer = 0; 
    let bouquet = [];
    let currentSceneIndex = 0;
    let particles = []; 

    // --- ASSETS & DATA ---

    const scenes = [
        {
            name: "Switzerland, Daisy",
            bgColor: "#d4fc79", 
            bgColor2: "#96e6a1",
            groundColor: "#81c784",
            flower: { type: 'daisy', color: '#ffffff', center: '#ffeb3b' },
            landmark: 'bush',
            weather: 'pollen',
            hardship: false
        },
        {
            name: "Netherlands, Tulip",
            bgColor: "#a1c4fd",
            bgColor2: "#c2e9fb",
            groundColor: "#66bb6a",
            flower: { type: 'tulip', color: '#ff4081', center: '#c2185b' },
            landmark: 'windmill',
            weather: 'windy',
            hardship: false
        },
        {
            name: "England, Red Rose",
            bgColor: "#ffcdd2",
            bgColor2: "#ef9a9a",
            groundColor: "#a5d6a7",
            flower: { type: 'rose', color: '#d32f2f', center: '#b71c1c' },
            landmark: 'bush',
            weather: 'pollen',
            hardship: false
        },
        {
            name: "Antarctica, Pearlwort",
            bgColor: "#e0f7fa", 
            bgColor2: "#b2ebf2",
            groundColor: "#e1f5fe",
            flower: { type: 'pearlwort', color: '#fff9c4', center: '#81c784' },
            landmark: 'iceberg',
            weather: 'snowstorm',
            hardship: true
        },
        {
            name: "Arizona, Saguaro Flower",
            bgColor: "#ffcc80", 
            bgColor2: "#ffab91",
            groundColor: "#f4a261",
            flower: { type: 'cactus_flower', color: '#ffffff', center: '#fdd835' },
            landmark: 'cactus',
            weather: 'heatwave',
            hardship: true
        },
        {
            name: "California, Desert Lily",
            bgColor: "#ffecb3", 
            bgColor2: "#ffe082",
            groundColor: "#e6b980",
            flower: { type: 'desert_lily', color: '#fafafa', center: '#a1887f' },
            landmark: 'dunes',
            weather: 'heatwave',
            hardship: true
        },
        {
            name: "Italy, Sunflower",
            bgColor: "#fff9c4",
            bgColor2: "#fff59d",
            groundColor: "#fdd835",
            flower: { type: 'sunflower', color: '#fbc02d', center: '#3e2723' },
            landmark: 'mountain',
            weather: 'sunny',
            hardship: false
        },
        {
            name: "Japan, Cherry Blossom",
            bgColor: "#fbc2eb",
            bgColor2: "#a6c1ee",
            groundColor: "#f8bbd0",
            flower: { type: 'sakura', color: '#ff80ab', center: '#f50057' },
            landmark: 'pagoda',
            weather: 'sakura',
            hardship: false
        },
        {
            name: "", // HOME (Empty name to hide top text)
            bgColor: "#ff9a9e",
            bgColor2: "#fecfef",
            groundColor: "#f8bbd0",
            flower: null,
            landmark: 'heart',
            weather: 'hearts',
            hardship: false
        }
    ];

    // Bear Configuration
    const activeBear = {
        x: -100,
        y: ch - 180,
        w: 120,
        h: 120,
        color: '#a16b4c', // Brown color
        state: 'idle', 
        direction: 1, 
        legAngle: 0
    };

    const recipientBear = {
        x: cw - 120,
        y: ch - 180,
        w: 120,
        h: 120,
        color: '#ffffff', // White color
        visible: false
    };

    // --- UTILS ---
    function randomRange(min, max) {
        return Math.random() * (max - min) + min;
    }

    // --- DRAWING FUNCTIONS ---

    function drawRoundedRect(x, y, w, h, r, color, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        if (stroke) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#5d4037';
            ctx.stroke();
        }
    }

    function drawBear(obj, isWalking, hasBouquet, isPicking, isTired) {
        const { x, y, w, h, color } = obj;
        
        ctx.save();
        ctx.translate(x, y);

        // Bobbing animation
        let bobSpeed = isTired ? 0.1 : 0.2;
        let bobHeight = isTired ? 2 : 5;
        let bob = isWalking ? Math.sin(frame * bobSpeed) * bobHeight : 0;
        
        // Picking animation
        let breathe = !isWalking && !isPicking ? Math.sin(frame * 0.05) * 1 : 0;
        if (isTired && !isWalking) breathe = Math.sin(frame * 0.15) * 2; 

        let pickRot = isPicking ? Math.sin(frame * 0.1) * 0.1 + 0.2 : 0;
        let pickY = isPicking ? 10 : 0;
        
        let slouch = isTired ? 0.1 : 0;

        ctx.translate(0, pickY);
        ctx.rotate(pickRot + slouch);

        // Legs
        let legSpeed = isTired ? 0.1 : 0.2;
        let legOffset = isWalking ? Math.sin(frame * legSpeed) * 10 : 0;
        
        drawRoundedRect(30 + legOffset, 80 - bob, 25, 30, 10, color, true);
        drawRoundedRect(65 - legOffset, 80 - bob, 25, 30, 10, color, true);

        // Body
        drawRoundedRect(15, 40 - bob + breathe, 90, 60, 25, color, true);

        // Head
        ctx.beginPath();
        let headY = isTired ? 40 : 35;
        ctx.ellipse(60, headY - bob + breathe, 55, 45, 0, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#5d4037';
        ctx.stroke();

        // Ears
        let earY = isTired ? 15 : 5;
        ctx.beginPath();
        ctx.arc(25, earY - bob + breathe, 12, 0, Math.PI * 2); // Left
        ctx.arc(95, earY - bob + breathe, 12, 0, Math.PI * 2); // Right
        ctx.fillStyle = color;
        ctx.fill();
        ctx.stroke();
        // Inner Ear (Pink)
        ctx.beginPath();
        ctx.arc(25, earY - bob + breathe, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#f48fb1';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(95, earY - bob + breathe, 6, 0, Math.PI * 2);
        ctx.fill();

        // Sweat Drops
        if (isTired) {
             ctx.fillStyle = '#4fc3f7';
             ctx.beginPath();
             let dropY1 = (frame % 40) * 0.5;
             ctx.ellipse(20, 30 + dropY1 - bob, 3, 5, 0, 0, Math.PI*2);
             ctx.fill();
             let dropY2 = ((frame + 20) % 40) * 0.5;
             ctx.ellipse(100, 30 + dropY2 - bob, 3, 5, 0, 0, Math.PI*2);
             ctx.fill();
        }

        // Face
        ctx.fillStyle = '#3e2723';
        if (isTired) {
             ctx.lineWidth = 2;
             ctx.beginPath();
             ctx.moveTo(38, headY - 5 - bob + breathe); ctx.lineTo(45, headY - bob + breathe); ctx.lineTo(38, headY + 5 - bob + breathe);
             ctx.moveTo(82, headY - 5 - bob + breathe); ctx.lineTo(75, headY - bob + breathe); ctx.lineTo(82, headY + 5 - bob + breathe);
             ctx.stroke();
        } else if (frame % 150 < 5) {
            ctx.beginPath();
            ctx.moveTo(35, 30 - bob + breathe); ctx.lineTo(55, 30 - bob + breathe);
            ctx.moveTo(65, 30 - bob + breathe); ctx.lineTo(85, 30 - bob + breathe);
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(45, 30 - bob + breathe, 3, 0, Math.PI * 2);
            ctx.arc(75, 30 - bob + breathe, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // Blush
        ctx.fillStyle = '#ffcdd2';
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        let blushY = isTired ? headY + 3 : 38;
        ctx.ellipse(35, blushY - bob + breathe, 6, 3, 0, 0, Math.PI*2);
        ctx.ellipse(85, blushY - bob + breathe, 6, 3, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;

        // Snout
        ctx.fillStyle = '#ffffff'; 
        if (color !== '#ffffff') ctx.fillStyle = '#d7ccc8'; // Light brown for brown bear
        else ctx.fillStyle = '#fff';
        
        let snoutY = isTired ? headY + 3 : 38;
        ctx.beginPath();
        ctx.ellipse(60, snoutY - bob + breathe, 14, 10, 0, 0, Math.PI*2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#3e2723';
        ctx.beginPath();
        ctx.arc(60, snoutY - 2 - bob + breathe, 3, 0, Math.PI*2);
        ctx.fill();
        
        // Mouth
        ctx.beginPath();
        if (isTired) {
            ctx.fillStyle = '#d32f2f';
            ctx.ellipse(60, snoutY + 5 - bob + breathe, 4, 5, 0, 0, Math.PI*2);
            ctx.fill();
        } else {
            ctx.moveTo(60, snoutY - 2 - bob + breathe);
            ctx.lineTo(60, snoutY + 4 - bob + breathe);
            ctx.moveTo(60, snoutY + 4 - bob + breathe);
            ctx.quadraticCurveTo(55, snoutY + 7 - bob + breathe, 54, snoutY + 4 - bob + breathe);
            ctx.moveTo(60, snoutY + 4 - bob + breathe);
            ctx.quadraticCurveTo(65, snoutY + 7 - bob + breathe, 66, snoutY + 4 - bob + breathe);
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // Arms
        let armY = isTired ? 65 : 60;
        if (hasBouquet || isPicking) {
            drawRoundedRect(35, armY - bob + breathe, 20, 20, 8, color, true);
            drawRoundedRect(65, armY - bob + breathe, 20, 20, 8, color, true);
            // Draw bouquet if holding it, but allow external render (for handover)
            if (!isPicking && hasBouquet === true) drawBouquet(60, armY - 10 - bob + breathe, 0.5); 
        } else {
            drawRoundedRect(40, armY - bob + breathe, 20, 25, 8, color, true);
        }

        ctx.restore();
    }

    function drawFlower(x, y, type, scale = 1, applyWind = true) {
        ctx.save();
        ctx.translate(x, y);
        
        if (applyWind) {
            const wind = Math.sin(frame * 0.05) * 0.15; 
            ctx.rotate(wind);
        }
        
        ctx.scale(scale, scale);

        // Bloom Logic
        if (type === 'daisy') {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, 15, 0, 30);
            ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(5, 20, 5, 2, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = '#4caf50'; ctx.fill();

            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 8; i++) {
                ctx.beginPath(); ctx.ellipse(0, 0, 4, 10, (Math.PI * 2 * i) / 8, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        } 
        else if (type === 'tulip') {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, 15, 0, 30);
            ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(5, 20, 5, 2, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = '#4caf50'; ctx.fill();

            ctx.fillStyle = '#ff4081';
            ctx.beginPath(); ctx.arc(0, -5, 8, 0, Math.PI, false);
            ctx.lineTo(-8, -15); ctx.lineTo(-3, -8); ctx.lineTo(0, -15);
            ctx.lineTo(3, -8); ctx.lineTo(8, -15); ctx.closePath(); ctx.fill();
        } 
        else if (type === 'rose') {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2, 15, 0, 30);
            ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(-3,8); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(3,18); ctx.stroke();

            ctx.fillStyle = '#b71c1c'; 
            ctx.beginPath(); ctx.arc(0, -5, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#d32f2f'; 
            ctx.beginPath(); ctx.arc(2, -7, 7, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-2, -3, 7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f44336'; 
            ctx.beginPath(); ctx.arc(0, -5, 4, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#7f0000'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, -5, 3, 0, 5); ctx.stroke();
        }
        else if (type === 'sakura') {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, 15, 0, 30);
            ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#ff80ab';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath(); ctx.ellipse(0, 0, 5, 8, (Math.PI * 2 * i) / 5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#f50057';
            ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
        } 
        else if (type === 'pearlwort') {
            ctx.fillStyle = '#81c784';
            ctx.beginPath(); ctx.arc(0, 20, 15, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff9c4'; 
            for(let i=0; i<5; i++) {
                ctx.beginPath(); ctx.arc(-10 + i*5, 15 + (i%2)*5, 3, 0, Math.PI*2); ctx.fill();
            }
        }
        else if (type === 'cactus_flower') {
            ctx.fillStyle = '#43a047';
            ctx.beginPath(); ctx.ellipse(0, 30, 10, 20, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 10; i++) {
                ctx.beginPath(); ctx.ellipse(0, 0, 3, 12, (Math.PI * 2 * i) / 10, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#fdd835';
            ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
        }
        else if (type === 'desert_lily') {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2, 20, 0, 40);
            ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#8d6e63'; 
            ctx.beginPath(); ctx.ellipse(5, 35, 15, 3, 0.5, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#fafafa';
            ctx.beginPath(); ctx.moveTo(0, 10);
            ctx.quadraticCurveTo(-10, -10, -15, -15); ctx.quadraticCurveTo(0, -5, 15, -15);
            ctx.quadraticCurveTo(10, -10, 0, 10); ctx.fill();
            ctx.strokeStyle = '#e0e0e0';
            ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -10); ctx.stroke();
        }
        else if (type === 'sunflower') {
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(5, 15, 0, 30);
            ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.ellipse(5, 20, 5, 2, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = '#4caf50'; ctx.fill();

            ctx.fillStyle = '#fbc02d';
            for (let i = 0; i < 12; i++) {
                ctx.beginPath(); ctx.ellipse(0, 0, 4, 12, (Math.PI * 2 * i) / 12, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#3e2723';
            ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        }

        ctx.restore();
    }

    function drawBouquet(x, y, scale = 0.7) {
        if (bouquet.length === 0) return;
        
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        
        // Simple bouquet for holding in hand
        bouquet.forEach((flowerType, index) => {
            const angle = (index - (bouquet.length - 1) / 2) * 0.3; 
            ctx.save();
            ctx.rotate(angle);
            ctx.translate(0, -10); 
            drawFlower(0, 0, flowerType, 1.0, false); 
            ctx.restore();
        });
        
        // Ribbon
        ctx.fillStyle = '#ef5350';
        ctx.beginPath();
        ctx.arc(0, 20, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath(); ctx.moveTo(0,20); ctx.lineTo(-10, 40); ctx.lineTo(0, 35); ctx.lineTo(10, 40); ctx.fill();
        
        ctx.restore();
    }

    function drawSunburst(x, y, frame) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(frame * 0.02); 
        
        const rayCount = 12;
        const maxRadius = Math.max(cw, ch);
        
        for(let i=0; i<rayCount; i++) {
            ctx.rotate((Math.PI * 2) / rayCount);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-50, maxRadius);
            ctx.lineTo(50, maxRadius);
            ctx.closePath();
            
            if(i % 2 === 0) ctx.fillStyle = "rgba(255, 255, 224, 0.4)"; 
            else ctx.fillStyle = "rgba(255, 215, 0, 0.2)"; 
            
            ctx.fill();
        }
        ctx.restore();
        
        const gradient = ctx.createRadialGradient(x, y, 10, x, y, 200);
        gradient.addColorStop(0, "rgba(255, 255, 255, 0.8)");
        gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath(); ctx.arc(x, y, 200, 0, Math.PI*2); ctx.fill();
    }

    // Improved Neat Bouquet Drawing
    function drawBigBouquetPopUp(scale) {
        const bx = cw / 2;
        const by = ch / 2 - 20;
        
        ctx.save();
        ctx.translate(bx, by);
        ctx.scale(scale, scale); 

        // Wrapper (Cone Shape)
        ctx.fillStyle = "#fff"; // Inner Paper
        ctx.beginPath();
        ctx.moveTo(-40, 0);
        ctx.lineTo(0, 100);
        ctx.lineTo(40, 0);
        ctx.fill();
        ctx.strokeStyle = "#e0e0e0";
        ctx.stroke();

        ctx.fillStyle = "#e1bee7"; // Outer Wrapping (Purple tint)
        ctx.beginPath();
        ctx.moveTo(-40, 20);
        ctx.lineTo(0, 100);
        ctx.lineTo(40, 20);
        ctx.fill();
        
        // Arrange flowers neatly in rows
        // Back row (tall flowers)
        const backRow = bouquet.filter(f => ['rose', 'tulip', 'desert_lily'].includes(f));
        // Middle row
        const midRow = bouquet.filter(f => ['sunflower', 'cactus_flower'].includes(f));
        // Front row (small)
        const frontRow = bouquet.filter(f => !backRow.includes(f) && !midRow.includes(f));
        
        // Helper to draw a row
        function drawRow(flowers, yOffset, xSpread, scale) {
             const total = flowers.length;
             flowers.forEach((flower, i) => {
                 let xPos = (i - (total-1)/2) * xSpread;
                 drawFlower(xPos, yOffset - Math.abs(xPos)*0.2, flower, scale, false);
             });
        }

        drawRow(backRow, -30, 20, 1.2);
        drawRow(midRow, -10, 25, 1.2);
        drawRow(frontRow, 10, 20, 1.1);
        
        // Big Ribbon Bow
        ctx.fillStyle = '#ba68c8'; // Purple ribbon
        ctx.beginPath(); ctx.arc(0, 60, 10, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.bezierCurveTo(-20, 60, -40, 40, -40, 60); ctx.bezierCurveTo(-40, 80, -20, 60, 0, 60); ctx.fill(); // Left loop
        ctx.beginPath(); ctx.bezierCurveTo(20, 60, 40, 40, 40, 60); ctx.bezierCurveTo(40, 80, 20, 60, 0, 60); ctx.fill(); // Right loop
        
        ctx.restore();
    }

    // --- WEATHER SYSTEM ---
    
    function initWeather(type) {
        particles = [];
        let count = 30;
        if (type === 'snowstorm') count = 100;
        if (type === 'heatwave') count = 20;

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * cw,
                y: Math.random() * ch,
                speedX: randomRange(-1, 1),
                speedY: randomRange(1, 3),
                size: randomRange(2, 5),
                rot: Math.random() * Math.PI
            });
        }
    }

    function drawWeather(type) {
        if (type === 'pollen') {
            ctx.fillStyle = 'rgba(255, 255, 200, 0.6)';
            particles.forEach(p => {
                p.y += p.speedY * 0.5;
                p.x += Math.sin(frame * 0.05 + p.y) * 0.5;
                if (p.y > ch) p.y = -10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        else if (type === 'windy') {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            particles.forEach((p, i) => {
                if (i % 3 === 0) { 
                    p.x += 4; 
                    if (p.x > cw) p.x = -50;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 30, p.y);
                    ctx.stroke();
                }
            });
        }
        else if (type === 'snowstorm') {
            ctx.fillStyle = '#ffffff';
            particles.forEach(p => {
                p.y += p.speedY * 2; 
                p.x += p.speedX + 2; 
                if (p.y > ch) { p.y = -10; p.x = Math.random() * cw; }
                if (p.x > cw) p.x = -10;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(0, 0, cw, ch);
        }
        else if (type === 'heatwave') {
            ctx.strokeStyle = 'rgba(255, 160, 0, 0.1)';
            ctx.lineWidth = 4;
            particles.forEach(p => {
                p.y -= p.speedY * 0.5; 
                if (p.y < 0) p.y = ch + 10;
                let waveX = p.x + Math.sin(frame * 0.1 + p.y * 0.05) * 5;
                ctx.beginPath();
                ctx.moveTo(waveX, p.y);
                ctx.lineTo(waveX, p.y - 20);
                ctx.stroke();
            });
            ctx.fillStyle = 'rgba(255, 255, 0, 0.15)';
            ctx.beginPath();
            ctx.arc(cw, 0, 150 + Math.sin(frame*0.05)*10, 0, Math.PI*2);
            ctx.fill();
        }
        else if (type === 'sakura') {
            ctx.fillStyle = '#f8bbd0';
            particles.forEach(p => {
                p.y += p.speedY * 0.8;
                p.x += Math.sin(frame * 0.05 + p.y * 0.01) * 1;
                p.rot += 0.05;
                if (p.y > ch) p.y = -10;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size/2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });
        }
        else if (type === 'sunny') {
            ctx.save();
            ctx.translate(0, 0); 
            ctx.rotate(frame * 0.005);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            for(let i=0; i<12; i++) {
                ctx.rotate(Math.PI / 6);
                ctx.beginPath();
                ctx.moveTo(0,0);
                ctx.lineTo(100, ch*2);
                ctx.lineTo(-100, ch*2);
                ctx.fill();
            }
            ctx.restore();
            ctx.fillStyle = 'rgba(255, 255, 200, 0.2)';
            ctx.beginPath();
            ctx.arc(cw*0.8, ch*0.2, 50 + Math.sin(frame*0.05)*10, 0, Math.PI*2);
            ctx.fill();
        }
    }

    function drawBackground(sceneIdx) {
        if (!scenes[sceneIdx]) return;
        const scene = scenes[sceneIdx];
        
        // Sky Gradient
        const gradient = ctx.createLinearGradient(0, 0, 0, ch);
        gradient.addColorStop(0, scene.bgColor);
        gradient.addColorStop(1, scene.bgColor2);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, cw, ch);

        // Ground
        ctx.fillStyle = scene.groundColor;
        ctx.beginPath();
        ctx.moveTo(0, ch - 100);
        ctx.bezierCurveTo(cw/3, ch - 120, 2*cw/3, ch - 80, cw, ch - 100);
        ctx.lineTo(cw, ch);
        ctx.lineTo(0, ch);
        ctx.fill();

        // Decorative bg elements
        ctx.fillStyle = "rgba(255,255,255,0.4)";
        if (scene.name.includes("Antarctica")) ctx.fillStyle = "rgba(255,255,255,0.7)"; 
        if (scene.name.includes("Desert") || scene.name.includes("Arizona")) ctx.fillStyle = "rgba(161, 136, 127, 0.3)"; 
        
        ctx.beginPath();
        if (scene.name.includes("Antarctica")) {
             ctx.moveTo(20, ch); ctx.lineTo(60, ch-150); ctx.lineTo(100, ch); ctx.fill();
             ctx.moveTo(cw-120, ch); ctx.lineTo(cw-80, ch-180); ctx.lineTo(cw-20, ch); ctx.fill();
        } else {
             ctx.arc(50, 100, 30, 0, Math.PI*2);
             ctx.arc(90, 110, 40, 0, Math.PI*2);
             ctx.arc(130, 100, 30, 0, Math.PI*2);
             ctx.fill();
        }

        if (scene.landmark === 'windmill') {
            ctx.save();
            ctx.translate(cw - 80, ch - 180);
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(-10, 0, 20, 80); 
            ctx.translate(0, 0);
            ctx.rotate(frame * 0.05); 
            ctx.fillStyle = '#ef9a9a';
            ctx.fillRect(-60, -5, 120, 10);
            ctx.fillRect(-5, -60, 10, 120);
            ctx.restore();
        } else if (scene.landmark === 'pagoda') {
            ctx.fillStyle = '#e57373';
            ctx.fillRect(cw - 100, ch - 200, 60, 100); 
            ctx.fillStyle = '#5d4037';
            ctx.beginPath(); ctx.moveTo(cw-110, ch-170); ctx.lineTo(cw-30, ch-170); ctx.lineTo(cw-70, ch-190); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cw-110, ch-140); ctx.lineTo(cw-30, ch-140); ctx.lineTo(cw-70, ch-160); ctx.fill();
        } else if (scene.landmark === 'cactus') {
            ctx.fillStyle = '#66bb6a';
            ctx.beginPath(); 
            ctx.roundRect(cw-100, ch-250, 40, 150, 20); 
            ctx.roundRect(cw-120, ch-200, 20, 60, 10); 
            ctx.roundRect(cw-50, ch-220, 20, 50, 10); 
            ctx.fill();
        }
        
        drawWeather(scene.weather);

        if (scene.flower && gameState !== 'transition') {
            const flowerX = cw / 2 + 50;
            const flowerY = ch - 130;
            drawFlower(flowerX, flowerY, scene.flower.type, 1.5, true);
        }
    }

    // --- GAME LOOP ---

    function gameLoop() {
        ctx.clearRect(0, 0, cw, ch);
        frame++;

        if (!scenes[currentSceneIndex]) {
            requestAnimationFrame(gameLoop);
            return;
        }

        const currentScene = scenes[currentSceneIndex];

        drawBackground(currentSceneIndex);

        // --- END SEQUENCE LOGIC ---
        if (gameState === 'end') {
            endSequenceTimer++;

            if (endSequenceTimer < 240) { // 4 seconds of cutscene
                // -- Phase 1: Brown Bear Approaches (0-60) --
                // -- Phase 2: Handover (60-120) --
                // -- Phase 3: White Bear Holds (120-180) --
                
                recipientBear.visible = true;
                
                // --- Animate Handover ---
                // Does brown bear have flowers?
                let brownBearHasFlowers = endSequenceTimer < 100;
                // Does white bear have flowers?
                let whiteBearHasFlowers = endSequenceTimer >= 100;
                
                // Animate Bouquet Position during transition
                let bouquetX = 0, bouquetY = 0, bouquetVisible = true;
                
                // Draw Brown Bear (Active/Traveler)
                // Brown bear is slightly to the left
                const brownBearX = recipientBear.x - 90;
                
                // Draw White Bear (Recipient)
                drawBear(recipientBear, false, whiteBearHasFlowers, false, false);
                
                // Draw Brown Bear
                // If brown bear gave flowers, arms empty
                drawBear({...activeBear, x: brownBearX}, false, brownBearHasFlowers, false, false);
                
                // "Flying" Bouquet during transfer (Frames 90-110)
                if (endSequenceTimer >= 90 && endSequenceTimer < 110) {
                     // Interpolate
                     let t = (endSequenceTimer - 90) / 20; // 0 to 1
                     let startX = brownBearX + 60;
                     let startY = activeBear.y + 50;
                     let endX = recipientBear.x + 40;
                     let endY = recipientBear.y + 50;
                     
                     let curX = startX + (endX - startX) * t;
                     let curY = startY + (endY - startY) * t - Math.sin(t*Math.PI)*20; // Arc
                     
                     drawBouquet(curX, curY, 0.6);
                }

                // Hearts
                ctx.globalAlpha = (Math.sin(frame * 0.1) + 1) / 2;
                ctx.font = "30px Arial";
                ctx.fillText("❤️", cw/2, ch - 250 - (frame % 50));
                ctx.globalAlpha = 1.0;
                
                if (endSequenceTimer > 20) {
                    finalMsgText.classList.add('show-final-message');
                }
                
                actionBtn.innerText = "Giving flowers...";
                
            } else {
                // PHASE 4: PVZ REVEAL
                // HIDE the handover text immediately
                finalMsgText.classList.remove('show-final-message');
                
                // Draw sunburst rays
                drawSunburst(cw/2, ch/2, frame);
                
                // Calculate scale for elastic pop-up
                let animTime = endSequenceTimer - 240;
                let scale = 0;
                if (animTime < 60) {
                    // Elastic ease out
                    let t = animTime / 60;
                    scale = 2.5 * (Math.sin(-13 * (t + 1) * Math.PI * 2) * Math.pow(2, -10 * t) + 1);
                } else {
                    scale = 2.5 + Math.sin(frame * 0.05) * 0.1; // Gentle hover pulse
                }
                
                drawBigBouquetPopUp(scale);
                
                // Trigger Text UI if not already done
                if (endSequenceTimer === 260) {
                   showEndUI();
                }
            }
            
            // Continue loop
            requestAnimationFrame(gameLoop);
            return;
        }

        // --- Standard Logic ---

        // Recipient Bear Logic (Only in final scene BEFORE end state)
        if (currentSceneIndex === scenes.length - 1 && gameState !== 'end') {
            recipientBear.visible = true;
            drawBear(recipientBear, false, false, false, false);
        }

        // Active Bear Logic
        let isTired = currentScene.hardship;
        if (gameState === 'walking_out' || gameState === 'walking_in') {
             if (currentScene.hardship) isTired = true;
        }
        
        if (gameState === 'start') {
            activeBear.x = -100;
        } 
        else if (gameState === 'walking_in') {
            activeBear.x += isTired ? 1.5 : 3;
            
            let stopPoint = cw / 2 - 100;
            if (currentSceneIndex === scenes.length - 1) stopPoint = cw / 2 - 130; // Stop earlier for handover

            if (activeBear.x > stopPoint) {
                if (currentSceneIndex === scenes.length - 1) {
                    gameState = 'end';
                    endSequenceTimer = 0; 
                } else {
                    gameState = 'picking_wait';
                    waitTimer = 0;
                    actionBtn.classList.add('auto-playing');
                    if (isTired) actionBtn.innerText = "Whew... found it...";
                    else actionBtn.innerText = "Found a pretty flower...";
                }
            }
        } 
        else if (gameState === 'picking_wait') {
            waitTimer++;
            drawBear(activeBear, false, bouquet.length > 0, true, isTired); 
            
            if (waitTimer > 120) { 
                 bouquet.push(currentScene.flower.type);
                 gameState = 'walking_out';
                 waitTimer = 0;
                 actionBtn.innerText = "Adding to bouquet...";
            }
        }
        else if (gameState === 'walking_out') {
            activeBear.x += isTired ? 1.5 : 3;
            if (activeBear.x > cw) {
                gameState = 'transition';
                nextScene();
            }
        }

        if (gameState !== 'picking_wait') {
             drawBear(activeBear, gameState.includes('walking'), bouquet.length > 0, false, isTired);
        }

        requestAnimationFrame(gameLoop);
    }

    // --- CONTROLS ---

    function startScene() {
        if (!scenes[currentSceneIndex]) return;
        
        const scene = scenes[currentSceneIndex];
        // Don't show location text for home scene
        if (scene.name !== "") {
            locationText.innerText = scene.name;
            locationText.classList.add('show-text');
        } else {
            locationText.classList.remove('show-text');
        }
        
        initWeather(scene.weather);

        activeBear.x = -80; 
        gameState = 'walking_in';
        
        thoughtBubble.style.transform = "translate(-50%, -50%) scale(0)";
    }

    function nextScene() {
        if (currentSceneIndex >= scenes.length - 1) return;

        currentSceneIndex++;
        locationText.classList.remove('show-text');
        setTimeout(() => { startScene(); }, 800); 
    }

    function showEndUI() {
        actionBtn.classList.remove('auto-playing');
        actionBtn.innerText = "Here's a virtual bouquet of flowers for you 💐";
        locationText.innerText = ""; 
        
        // Hide message explicitly if still visible
        finalMsgText.classList.remove('show-final-message');

        const existing = document.getElementById('end-title-overlay');
        if (existing) existing.remove();

        const endTitle = document.createElement('div');
        endTitle.id = 'end-title-overlay';
        endTitle.style.position = 'absolute';
        endTitle.style.top = '5%'; // Moved Up to top
        endTitle.style.width = '100%';
        endTitle.style.textAlign = 'center';
        endTitle.style.fontFamily = "'Fredoka One', cursive";
        endTitle.style.fontSize = '32px';
        endTitle.style.color = '#e91e63';
        endTitle.style.textShadow = '2px 2px white';
        endTitle.style.animation = 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        endTitle.innerHTML = "Happy Valentine's<br>Day po!";
        
        const style = document.createElement('style');
        style.innerHTML = `@keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }`;
        document.head.appendChild(style);
        
        container.appendChild(endTitle);
        
        // Move button down
        document.querySelector('.controls').style.bottom = '10px';
    }

    actionBtn.addEventListener('click', () => {
        if (gameState === 'start') {
            startScene();
            thoughtBubble.style.transform = "translate(-50%, -50%) scale(1)";
            setTimeout(() => { thoughtBubble.style.transform = "translate(-50%, -50%) scale(0)"; }, 2000);
            actionBtn.classList.add('auto-playing');
            actionBtn.innerText = "Traveling the world...";
        } 
        else if (gameState === 'end') {
            location.reload();
        }
    });

    window.addEventListener('resize', () => {
        cw = container.clientWidth;
        ch = container.clientHeight;
        canvas.width = cw;
        canvas.height = ch;
        activeBear.y = ch - 180;
        recipientBear.y = ch - 180;
        recipientBear.x = cw - 120;
    });

    requestAnimationFrame(gameLoop);

</script>
</body>
